# FleetFlow observability stack — production deployment manifest (Phase 13,
# blueprint §11.2/§11.3). Template for the Phase 15 orchestrator target: adjust
# image tags, resource limits, storage classes and the Prometheus bearer token
# (normally injected from a Secret, not inlined) before applying. The same
# prometheus.yml / Grafana provisioning files used by docker-compose are mounted
# here, so local and production dashboards stay identical.
#
# Before applying, generate the two Grafana configmaps from this repo's files
# (they are too large to inline here and must stay in sync with docker-compose):
#   kubectl create configmap fleetflow-grafana-provisioning -n fleetflow-observability \
#     --from-file=datasources=deploy/observability/grafana/provisioning/datasources/prometheus.yml \
#     --from-file=dashboards=deploy/observability/grafana/provisioning/dashboards/dashboards.yml
#   kubectl create configmap fleetflow-grafana-dashboards -n fleetflow-observability \
#     --from-file=fleetflow-overview.json=deploy/observability/grafana/dashboards/fleetflow-overview.json
# and a grafana-admin Secret with a password key.
---
apiVersion: v1
kind: Namespace
metadata:
  name: fleetflow-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetflow-prometheus
  namespace: fleetflow-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # API + worker run in the app namespace; scrape via headless service DNS.
      # The bearer token normally comes from a Secret -> this ConfigMap at deploy
      # time (phase 15 CD step); replace BEFORE enabling auth on the endpoints.
      - job_name: fleetflow-api
        metrics_path: /api/metrics
        static_configs:
          - targets: ["fleetflow-api.fleetflow.svc.cluster.local:3000"]
            labels: { service: fleetflow-api }
      - job_name: fleetflow-worker
        metrics_path: /metrics
        static_configs:
          - targets: ["fleetflow-worker.fleetflow.svc.cluster.local:9091"]
            labels: { service: fleetflow-worker }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fleetflow-observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
          ports: [{ containerPort: 9090 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: fleetflow-prometheus
        - name: storage
          emptyDir: {} # swap for a PVC in prod
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fleetflow-observability
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fleetflow-observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports: [{ containerPort: 3000 }]
          env:
            # Local-only anonymous access removed here — production requires login.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password }
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: storage
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: fleetflow-grafana-provisioning
        - name: dashboards
          configMap:
            name: fleetflow-grafana-dashboards
        - name: storage
          emptyDir: {} # swap for a PVC in prod
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fleetflow-observability
spec:
  selector: { app: grafana }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: fleetflow-observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 16686, name: ui }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: fleetflow-observability
spec:
  selector: { app: jaeger }
  ports:
    - { port: 4318, targetPort: 4318, name: otlp-http }
    - { port: 16686, targetPort: 16686, name: ui }
