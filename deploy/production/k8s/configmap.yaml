# Phase 15 — non-secret environment for the API/worker deployments.
# Anything sensitive lives in the Secret (secrets.example.yaml → real Secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetflow-config
  namespace: fleetflow
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # Web clients get the refresh token as an HttpOnly cookie; Secure is also
  # force-on by config.js when NODE_ENV=production — explicit here for clarity.
  WEB_REFRESH_COOKIE_SECURE: "true"
  # Comma-separated allow-list of browser origins (§5.6). The dashboard is
  # served same-origin via the Ingress, so this is for direct cross-origin use.
  CORS_ORIGINS: "https://fleet.example.com"
  # Global per-IP API rate limit (req/min). 300 is the MVP default — generous
  # per device. Raise only deliberately (e.g. a fleet behind one egress NAT).
  RATE_LIMIT_GLOBAL_MAX: "300"
  # Export artifacts: API (download route) and worker (writer) are separate
  # pods, so they share an RWX volume (see exportdata PVC). Production should
  # migrate deliver() to object storage (S3/GCS) — documented in exportService.
  EXPORT_ARTIFACT_DIR: "/app/data/exports"
  # OpenTelemetry: traces go to an OTLP/HTTP gateway (optional). Metrics are NOT
  # OTLP-exported (Jaeger/collectors rarely accept /v1/metrics) — they go to
  # Prometheus via /api/metrics + the worker exporter instead.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "fleetflow-api"
  OTEL_METRICS_EXPORTER: "none"