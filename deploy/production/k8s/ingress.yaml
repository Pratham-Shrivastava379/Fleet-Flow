# Phase 15 — ingress with TLS (cert-manager / Let's Encrypt annotations are
# vendor-neutral: any cert-manager-backed cluster works). The dashboard SPA is
# served same-origin as /api + /ws (blueprint §5.4 / §13.2 cookie + WS flow).
# Replace fleet.example.com with the real DNS name; keep the ws annotations so
# the WebSocket gateway (upgraded connections) survives proxies/timeouts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetflow
  namespace: fleetflow
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # create this ClusterIssuer first
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx # any ingress controller that supports websockets
  tls:
    - hosts:
        - fleet.example.com
      secretName: fleetflow-tls
  rules:
    - host: fleet.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fleetflow-api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: fleetflow-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleetflow-dashboard
                port:
                  name: http