# Phase 15 — Secret TEMPLATE. Copy to secrets.yaml (git-ignored), fill REAL
# base64 values, apply with: kubectl apply -f secrets.yaml
# Never commit a filled secrets.yaml. Prefer a cloud secrets manager +
# External Secrets Operator / CSI driver so values never sit in the repo at all.
#
# Generate values:
#   echo -n 'postgresql://user:pass@host:5432/fleetflow?schema=public' | base64 -w0
#   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"   # JWT secrets
apiVersion: v1
kind: Secret
metadata:
  name: fleetflow-secrets
  namespace: fleetflow
type: Opaque
data:
  # Managed Postgres with PostGIS enabled (RDS/Cloud SQL/Neon/…). No in-cluster DB.
  DATABASE_URL: "cGxhY2Vob2xkZXItZGF0YWJhc2UtdXJs"
  # Managed Redis (ElastiCache/Memorystore/Upstash/…).
  REDIS_URL: "cGxhY2Vob2xkZXItcmVkaXMtdXJs"
  # JWT signing secrets — 48+ random bytes each, rotate quarterly with a `kid`
  # claim (blueprint §5.5). Must NOT contain "dev-".
  JWT_ACCESS_SECRET: "cGxhY2Vob2xkZXItYWNjZXNzLXNlY3JldA=="
  JWT_REFRESH_SECRET: "cGxhY2Vob2xkZXItcmVmcmVzaC1zZWNyZXQ="
  # Bearer token for /api/metrics + worker exporter scrapes (§4.2 "not public").
  # Prometheus/Grafana scrapes must present it; empty = open (internal network only).
  METRICS_TOKEN: "cGxhY2Vob2xkZXItbWV0cmljcy10b2tlbg=="