# Phase 15 — shared export-artifact volume (api download route reads what the
# exports worker wrote). Needs a ReadWriteMany storage class (EFS/azurefile/
# Longhorn/NFS-CSI). Production should migrate exportService.deliver() to
# object storage (S3/GCS presigned URLs) per blueprint §13.2 — this PVC is the
# interim seam and can be removed once deliver() is object-storage-backed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleetflow-exportdata
  namespace: fleetflow
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi