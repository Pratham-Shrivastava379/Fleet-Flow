# Phase 15 — dashboard static SPA served by the nginx image (dashboard/Dockerfile,
# §13.2). Stateless; 2 replicas for HA behind the Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetflow-dashboard
  namespace: fleetflow
  labels:
    app: fleetflow-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleetflow-dashboard
  template:
    metadata:
      labels:
        app: fleetflow-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/YOUR-ORG/fleetflow-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi