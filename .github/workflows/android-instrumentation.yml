# §8 (testing & CI honesty): a REAL, manually-dispatched Android instrumentation
# workflow. The full instrumentation suite (connectedDebugAndroidTest) needs an
# emulator, which is too slow/expensive to run per-PR — so this runs on demand
# (workflow_dispatch) or weekly, exactly like the E2E workflow. It boots the
# standard ubuntu runner's hardware-accelerated emulator (KVM), waits for a
# usable device, and runs the project's existing instrumented tests against the
# debug build. The per-PR CI job (ci.yml android-test) runs only JVM unit tests
# + lint and its comment now points HERE instead of implying a scheduled run.
name: Android instrumentation (emulator)

on:
  schedule:
    # Thursdays 05:23 UTC — off-phase from the Monday E2E run.
    - cron: "23 5 * * 4"
  workflow_dispatch:

concurrency:
  group: android-instrumentation
  cancel-in-progress: true

jobs:
  instrumented:
    name: connectedDebugAndroidTest (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-default
      - name: Create AVD + generate pre-warmed snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Pre-warmed AVD snapshot generated."
      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: android/app/build/reports/androidTests/
