# Phase 14: CI pipeline. Every PR/push runs the backend suite
# against REAL Postgres+PostGIS / Redis service containers (never SQLite), the
# Android unit + lint suite, the dashboard lint/typecheck/test/build, and a
# security scan (prod-dependency npm audit + Trivy scan of the built image).
# Merge to `main` is gated on a green run via branch protection — the required
# status checks and repo setup steps are in .github/README.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  backend-test:
    name: Backend (Postgres+Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
          POSTGRES_DB: fleetflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetflow -d fleetflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same credentials as the local compose stack, so the suite exercises the
      # exact target DB shape (PostGIS extension included via the migrations).
      DATABASE_URL: postgresql://fleetflow:fleetflow@localhost:5432/fleetflow?schema=public
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate (test DB)
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test

  android-test:
    name: Android (unit + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + Android lint
        # Instrumented (emulator) tests are NOT run here per-PR — they run in the
        # separate android-instrumentation.yml workflow (manual dispatch or
        # weekly schedule); see that file. This job is JVM-only by design.
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

  dashboard-test:
    name: Dashboard (lint/type/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  security-scan:
    name: Security (audit + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend prod-dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Dashboard prod-dependency audit
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      # Dev-toolchain advisories (vite/vitest chain) don't ship in the built SPA;
      # surfaced non-blocking here and tracked by Dependabot (vite 7 / vitest 3
      # migration PR). See .github/README.md.
      - name: Dashboard dev-toolchain audit (informational)
        if: always()
        continue-on-error: true
        working-directory: dashboard
        run: npm audit
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (api target) for scanning
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: api
          push: false
          load: true
          tags: fleetflow-api:ci
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fleetflow-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
