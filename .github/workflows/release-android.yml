# Phase 14: Android release build on tag push (v*). Produces a
# SIGNED release AAB + APK — the keystore is materialized from CI secrets and
# never enters the repo — and uploads the AAB to the Play Console
# internal-testing track when Play credentials are configured. Until secrets
# exist the run still proves the signed build path (unsigned only if the
# keystore secret is missing entirely — see .github/README.md).
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Signed release + Play internal upload
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.ANDROID_VERSION_CODE }}" ]; then
            echo "VERSION_CODE=${{ secrets.ANDROID_VERSION_CODE }}" >> "$GITHUB_ENV"
          fi

      - name: Materialize signing keystore from secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Write release local.properties (API base URL, Sentry DSN)
        run: |
          : > local.properties
          if [ -n "${{ secrets.RELEASE_API_BASE_URL }}" ]; then
            echo "API_BASE_URL=${{ secrets.RELEASE_API_BASE_URL }}" >> local.properties
          fi
          if [ -n "${{ secrets.SENTRY_DSN }}" ]; then
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> local.properties
          fi

      - name: Build signed release AAB + APK
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fleetflow-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      # Internal-testing track first; promoted to production manually (§13.4).
      - name: Upload AAB to Play internal testing
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fleetflow.fleet
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
