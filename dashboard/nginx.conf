server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: unknown paths serve index.html (client routes).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; never cache index.html.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
